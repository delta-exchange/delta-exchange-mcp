name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to a commit SHA with the tag in the trailing comment, matching
# bundle.yml — see the note there for why and how to bump one.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-uv publishes no moving major tag past v7, hence the exact release.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # --locked also fails when uv.lock has drifted from pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts packaging

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared by requires-python; 3.13 is what most users are on.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

      - name: Install the Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --no-install-recommends --yes dbus-x11 gnome-keyring

      # Python keyring requires the daemon and the test process to share one D-Bus
      # session. The random unlock password and disposable credential stay inside it.
      - name: Test the Linux Secret Service adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash <<'KEYRING_SESSION'
          set -euo pipefail
          set +x
          keyring_password="$(openssl rand -hex 32)"
          printf '%s' "$keyring_password" | \
            gnome-keyring-daemon --unlock --components=secrets >/dev/null
          unset keyring_password
          DELTA_MCP_TEST_SYSTEM_KEYRING=1 \
            uv run pytest tests/test_system_keyring.py
          KEYRING_SESSION

      - name: Test the native system keyring adapter
        if: runner.os != 'Linux'
        run: uv run pytest tests/test_system_keyring.py
        env:
          DELTA_MCP_TEST_SYSTEM_KEYRING: "1"
