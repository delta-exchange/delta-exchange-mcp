[project]
name = "delta-exchange-mcp"
version = "0.4.1"
description = "Official MCP server for Delta Exchange India — market data and account read for AI assistants."
readme = "README.md"
authors = [
    { name = "Anuj Sharma", email = "anuj.sharma@delta.exchange" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12.4",
    "pydantic>=2.13.2",
]

[project.scripts]
delta-exchange-mcp = "delta_exchange_mcp:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.11",
]
evals = [
    "anthropic>=0.60",
    "deepeval>=4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
